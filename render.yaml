services:
  - type: web
    name: task-frontend
    runtime: node
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm preview -- --host 0.0.0.0 --port $PORT
    envVars:
      - key: VITE_API_URL
        value: https://task-manager-api.onrender.com/api

  - type: web
    name: task-manager-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: task_api
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: JWT_ISSUER
        value: task-api
      - key: JWT_AUDIENCE
        value: task-api-clients
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: task-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: AUTH_RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: AUTH_RATE_LIMIT_MAX
        value: 10
